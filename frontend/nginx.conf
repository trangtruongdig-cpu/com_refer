server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Nén do Caddy đảm nhận; bật thêm ở đây để chạy độc lập vẫn ổn
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck cho Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Asset có hash trong tên file => cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html không được cache để luôn lấy bản build mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: mọi route không phải file tĩnh trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
