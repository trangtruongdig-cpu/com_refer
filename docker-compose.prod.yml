# Môi trường PRODUCTION trên VPS
# File này được GitHub Actions copy lên VPS (APP_DIR) mỗi lần deploy.
# Image do GitHub Actions build và đẩy lên GHCR — KHÔNG build trên VPS.
#   docker compose -f docker-compose.prod.yml up -d
#   Monitoring (tùy chọn): docker compose -f docker-compose.prod.yml --profile monitoring up -d
# Rollback: TAG=<commit-sha> docker compose -f docker-compose.prod.yml up -d

name: app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # Chỉ Caddy mở port ra internet
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN_APP: ${DOMAIN_APP:?Thiếu DOMAIN_APP}
      DOMAIN_API: ${DOMAIN_API:-}
      ACME_EMAIL: ${ACME_EMAIL:?Thiếu ACME_EMAIL}
      DOMAIN_LOGS: ${DOMAIN_LOGS:-}
      DOMAIN_STATUS: ${DOMAIN_STATUS:-}
      MONITOR_USER: ${MONITOR_USER:-admin}
      MONITOR_PASSWORD_HASH: ${MONITOR_PASSWORD_HASH:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data # chứng chỉ SSL
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - web
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  frontend:
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}-frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - web
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  backend:
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - db
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # KHÔNG publish port 5432 — chỉ truy cập qua network nội bộ "db"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    # Cron chạy backup-db.sh lúc 2h sáng mỗi ngày (theo TZ).
    # Cron không kế thừa biến môi trường nên lưu ra file để script tự nạp.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export -p > /etc/backup.env
        echo "0 2 * * * /bin/sh /scripts/backup-db.sh > /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "db-backup: cron đã sẵn sàng (02:00 hằng ngày, TZ=$${TZ})"
        exec crond -f -l 8
    networks:
      - db
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------- Monitoring (tùy chọn) — profile "monitoring" ----------
  dozzle:
    image: amir20/dozzle:v8.8.3
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - web
    mem_limit: 256m
    logging: *default-logging

networks:
  web:
  # internal: không có route ra internet — postgres hoàn toàn bị cô lập
  db:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
